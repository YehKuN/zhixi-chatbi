<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chatbi-mark.svg?v=1.0.1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="智析 ChatBI——AI对话式企业数据分析与可视化平台" />
    <title>智析 ChatBI · 企业数据智能中枢</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("chatbi.theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
            document.documentElement.style.colorScheme = stored;
          }
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
