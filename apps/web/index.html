<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chatbi-mark.svg?v=1.0.1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eaf5ff" />
    <meta name="description" content="智析 ChatBI——AI对话式企业数据分析与可视化平台" />
    <title>智析 ChatBI · 企业数据智能中枢</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("chatbi.theme.v2");
          var theme = stored === "light" || stored === "dark" ? stored : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
